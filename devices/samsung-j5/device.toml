[device]
codename = "samsung-j5"
name = "Samsung Galaxy J5 2015"
arch = "aarch64"
status = "working"
origin = "pmos"

[source.pmos]
pmaports_commit = "dfb010f5b9885d185d089b6e1e493030062f9756"
device_pkg = "device-samsung-j5"
kernel_pkg = "linux-postmarketos-qcom-msm8916"
firmware_pkgs = ["firmware-qcom-adreno-a300", "firmware-samsung-j5-wcnss-nv"]
category = "archived"

[kernel]
mainline = true
version = "6.12.1"
artifacts_sha256 = "ebde63ff71bebfbb30372ad8823b4c63dc4268553592615de685fff456876de9"
soc = "msm8916"
gpu_driver = "freedreno"

[boot]
flash_method = "fastboot"
bootimg_header_version = 0
kernel_offset = "0x00080000"
ramdisk_offset = "0x02000000"
tags_offset = "0x01e00000"
base = "0x80000000"
second_offset = "0x00f00000"
pagesize = 2048
dtb = "qcom/msm8916-samsung-j5"
cmdline = "earlycon console=ttyMSM0,115200"
append_dtb = true
qcdt = false
sparse = true
rootfs_target = "userdata"
# disabled in the mainline dtb: the touchscreen's bus, and the SM5703 PMIC's (touch power)
# and blsp_i2c4 (the SM5703 fuel gauge at 0x71)
dtb_enable = ["/soc@0/i2c@78b9000", "/soc@0/i2c@78ba000", "/soc@0/i2c@78b8000"]
# [node, property, fdtput type, value]. Phandles are this kernel's (6.12.1):
# 0x9c is the SM5703 MUIC (/i2c-muic/extcon@25)
dtb_set = [
	# the J500N0 modem image spans 90 MiB (mainline reserves 88): q6v5-mss
	# refuses it with "segment outside memory range"
	["/reserved-memory/mpss@86800000", "reg", "x", "0 0x86800000 0 0x5a00000"],
	# battery: the overlay's sm5703_fuelgauge.ko
	["/soc@0/i2c@78b8000/fuel-gauge@71", "compatible", "s", "siliconmitus,sm5703-fuel-gauge"],
	["/soc@0/i2c@78b8000/fuel-gauge@71", "reg", "x", "0x71"],
	["/soc@0/i2c@78b8000/fuel-gauge@71", "extcon", "x", "0x9c"],
	# the motor is on the SM5703's LDO2: the overlay's sm5703_vibrator.ko
	["/soc@0/i2c@78ba000/vibrator@49", "compatible", "s", "siliconmitus,sm5703-vibrator"],
	["/soc@0/i2c@78ba000/vibrator@49", "reg", "x", "0x49"],
	# the name ztMETRO's torch looks for
	["/led-controller/led", "label", "s", "white:torch"],
]
defaulted = ["bootimg_header_version"]

[userspace]
daemons = ["rmtfs", "bluetooth", "msm-firmware-loader"]

[ztmetro]
scale = 1.67
vibrator = "auto"
rotation = 0

[verified]
date = ""
by = ""
checklist = {}
