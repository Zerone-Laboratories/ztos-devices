# The J5's speaker and microphone go through the modem's QDSP6, which cannot
# keep up with 256-frame periods: short sounds (taps, keys, notifications)
# underrun as they start and are never heard; with 1024 frames of headroom
# a ringtone still underran now and then (a crackle). Larger periods, and headroom.
monitor.alsa.rules = [
	{
		matches = [
			{ node.name = "~alsa_output.platform-7702000.*" }
			{ node.name = "~alsa_input.platform-7702000.*" }
		]
		actions = {
			update-props = {
				api.alsa.period-size = 1024
				api.alsa.headroom = 2048
				api.alsa.period-num = 8
				session.suspend-timeout-seconds = 0
			}
		}
	}
]
