SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"Headphones"
		"Earpiece"
	]

	EnableSequence [
		cset "name='SPK DAC Switch' 1"
		cset "name='RX3 MIX1 INP1' RX1"
		# -10 dB: at 0 dB the J5's speaker was too loud even low on the
		# volume slider, which only scales the samples
		cset "name='RX3 Digital Volume' 74"
	]

	DisableSequence [
		cset "name='RX3 Digital Volume' 0"
		cset "name='SPK DAC Switch' 0"
		cset "name='RX3 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPCM "${var:WcdPlaybackPCM}"
		PlaybackChannels 2
		PlaybackPriority 200
	}
}
